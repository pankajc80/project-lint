---
- name: Git clone the repo {{ item.name }} with branch {{ src_branch }}
  ansible.builtin.git:
    repo: "{{ url }}"
    dest: "{{ repo_path }}/{{ item.name }}"
    version: "{{ src_branch }}"
  
- name: Remove linted directory from linted branch
  ansible.builtin.include_tasks:
    file: tasks/delete_directory.yml
  when: src_branch == "linted"

- name: Checkout new branch named linted
  ansible.builtin.shell: |
    cd {{ repo_path }}/{{ item.name }}
    git config user.email "mrchandna@gmail.com"
    git config user.name "Pankaj"
    git checkout -b linted prod
  #ignore_errors: true
  when: src_branch == "prod"

- name: Task to look for YAML files to perform lint
  ansible.builtin.include_tasks:
    file: tasks/find_files.yml
  
- name: Add Commit and Push linted files to linted branch and checkout new branch without text files
  ansible.builtin.shell: |
    cd {{ repo_path }}/{{ item.name }}
    git add .
    git commit -m "Updated modules with FQCN, reformatted yaml and generated lint report"
    git push {{ url }} linted
    git push {{ url }} --tags
    git checkout -b prod_linted linted 
  #ignore_errors: true
  when: src_branch == "prod"

- name: Add Commit and Push linted files to linted branch and checkout new branch without text files 
  ansible.builtin.shell: |
    cd {{ repo_path }}/{{ item.name }}
    git config user.email "mrchandna@gmail.com"
    git config user.name "Pankaj"
    git add .
    git commit -m "Updated modules with FQCN, reformatted yaml and generated lint report"
    git push {{ url }} linted
    git push {{ url }} --tags
    git checkout -b prod_linted linted 
  #ignore_errors: true
  when: src_branch == "linted"

- name: Remove text reports from prod_linted branch
  ansible.builtin.include_tasks:
    file: tasks/delete_directory.yml

- name: Add and Commit linted files to prod_linted branch and push changes to remote repo
  ansible.builtin.shell: |
    cd {{ repo_path }}/{{ item.name }}
    git add .
    git commit -m "Updated modules with FQCN, reformatted yaml and generated lint report"
    git push {{ url }} prod_linted
    git push {{ url }} --tags
  #ignore_errors: true
  when: src_branch == "prod"

- name: Add and Commit linted files to prod_linted branch and push changes to remote repo
  ansible.builtin.shell: |
    cd {{ repo_path }}/{{ item.name }}
    git add .
    git commit -m "Updated modules with FQCN, reformatted yaml and generated lint report"
    git push {{ url }} prod_linted
    git push {{ url }} --tags
  #ignore_errors: true
  when: src_branch == "linted"

- name: Create Pull Request from prod_linted to prod
  ansible.builtin.uri:
    url: https://api.github.com/repos/ansible-automate/{{ item.name }}/pulls
    headers:
      Accept: application/vnd.github+json
      Authorization: Bearer {{ githubtoken }}
      X-GitHub-Api-Version: 2022-11-28
    body_format: json
    body:
      title: Marge prod_linted to prod
      head: prod_linted
      base: prod
    validate_certs: false
    method: POST
    status_code: 201